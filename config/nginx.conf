# Serves the built site for the Docker `runtime` target — the Coolify tester
# preview. Production is Cloudflare Pages and does not use this file.
#
# Because this host is staging-only, it sends X-Robots-Tag: noindex on every
# response. See the note at the server block before removing it.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # The container healthcheck hits / every 30s, which is 2,880 log lines a day
  # burying whatever real traffic this preview gets. Filtering by its user agent
  # rather than pointing it at a stub endpoint keeps the check meaningful: it
  # still fetches the actual homepage, so an empty or broken dist/ fails it.
  map $http_user_agent $loggable {
    default            1;
    docker-healthcheck 0;
  }

  access_log /dev/stdout combined if=$loggable;

  # nginx runs unprivileged here, so every write path has to move off the
  # root-owned defaults under /var/cache/nginx.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  # Resolved as a variable because an add_header inside a location DISCARDS
  # every add_header inherited from the parent — setting them all once at
  # server level keeps noindex from silently vanishing on asset routes.
  map $uri $cache_control {
    default    "public, max-age=0, must-revalidate";
    ~^/_astro/ "public, max-age=31536000, immutable";
  }

  server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit Location as a path rather than a full URL. nginx would otherwise
    # build it from its own listening port and scheme, so behind Coolify's TLS
    # proxy a redirect would send the visitor to http://host:8080/ instead of
    # https://host/. A relative Location resolves against the address the
    # browser actually used.
    absolute_redirect off;

    # This is a staging host serving a full copy of the marketing site. Without
    # this header Google can index it, and since SITE_URL makes the canonical
    # tags point at this domain, it would compete with production rather than
    # defer to it.
    #
    # Deliberately NOT paired with a robots.txt Disallow: a blocked crawler
    # never fetches the page, so it never sees this header, and the URL can
    # still be indexed from an external link. Allow the crawl, refuse the index.
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The bulk of the CSP is a <meta http-equiv> that Astro generates per page,
    # because every script on this site is inlined into the document and only
    # the build knows their hashes (see security.csp in astro.config.mjs).
    #
    # These two cannot live there. frame-ancestors is ignored in a <meta> CSP by
    # every browser, and HSTS is not CSP at all. A second CSP header does not
    # override the meta one — a page under two policies must satisfy both — so
    # this adds the framing rule rather than replacing anything.
    #
    # Mirrored in public/_headers for Cloudflare Pages, which serves production
    # and never loads this file. Change one, change the other.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # nginx never terminates TLS here — Coolify does, upstream — so this is only
    # meaningful because that proxy passes it through. No includeSubDomains and
    # no preload: this is one staging host on a shared apex, and committing
    # every sibling subdomain to HTTPS for a year is not this file's call.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Astro builds with build.format:'directory', so /privacy is on disk at
    # /privacy/index.html. A URI that already ends in a slash serves that file
    # directly.
    location ~ /$ {
      try_files ${uri}index.html =404;
    }

    # Anything else: serve the file if it exists, otherwise fall through.
    location / {
      try_files $uri @canonical;
    }

    # /privacy has a directory behind it, so redirect to /privacy/ rather than
    # serving the same page at two addresses. nginx's own index module would do
    # this with a 301; Cloudflare Pages uses 308, and matching it keeps the
    # tester preview honest about how production will behave.
    location @canonical {
      if (-d $document_root$uri) {
        return 308 $uri/;
      }
      return 404;
    }

    location /_astro/ {
      access_log off;
    }

    # Without this, a missing page falls back to the homepage with a 200, which
    # search engines read as a soft 404.
    error_page 404 /404.html;
  }
}
